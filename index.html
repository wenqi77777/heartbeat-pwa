<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="心动信号">
  <meta name="theme-color" content="#0a0a1a">
  <meta name="description" content="双人心动信号互动 - 发送心动动图给TA">

  <!-- PWA Manifest -->
  <link rel="manifest" href="/manifest.json">

  <!-- Apple Touch Icon -->
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png">

  <title>Heartbeat Signal · 心动信号</title>

  <style>
    /* ============================================================
       CSS 变量 & 全局样式
       ============================================================ */
    :root {
      --bg-deep: #0a0a1a;
      --color-gold: #d4a853;
      --color-gold-light: #f0d68a;
      --color-rose: #c47a6b;
      --color-white: #f5f0e8;
      --color-white-soft: rgba(245, 240, 232, 0.7);
      --color-card-bg: rgba(20, 20, 45, 0.65);
      --color-card-border: rgba(212, 168, 83, 0.25);
      --color-card-border-active: rgba(212, 168, 83, 0.85);
      --radius-lg: 24px;
      --radius-md: 16px;
      --radius-sm: 10px;
      --transition-smooth: cubic-bezier(0.4, 0, 0.2, 1);
      --safe-bottom: env(safe-area-inset-bottom, 16px);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow-x: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Helvetica Neue", sans-serif;
      background: var(--bg-deep);
      color: var(--color-white);
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      -webkit-user-select: none;
    }

    /* ============================================================
       星空画布（Canvas 背景层）
       ============================================================ */
    #star-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    /* ============================================================
       主内容容器
       ============================================================ */
    .app-container {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 20px 20px var(--safe-bottom);
    }

    /* ============================================================
       顶部标题
       ============================================================ */
    .header {
      text-align: center;
      padding-top: max(30px, env(safe-area-inset-top, 16px));
      margin-bottom: 10px;
    }

    .header-title {
      font-size: 1.6rem;
      font-weight: 300;
      letter-spacing: 0.15em;
      color: var(--color-gold);
      text-transform: lowercase;
      text-shadow: 0 0 40px rgba(212, 168, 83, 0.35);
      animation: titleGlow 3s ease-in-out infinite;
    }

    @keyframes titleGlow {
      0%, 100% { text-shadow: 0 0 40px rgba(212, 168, 83, 0.35); }
      50% { text-shadow: 0 0 60px rgba(212, 168, 83, 0.6); }
    }

    /* ============================================================
       发送按钮区域
       ============================================================ */
    .send-btn-area {
      flex-shrink: 0;
      margin: 30px 0 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .send-btn {
      position: relative;
      width: 160px;
      height: 160px;
      border-radius: 50%;
      background: radial-gradient(circle at 40% 35%, rgba(212, 168, 83, 0.3), rgba(10, 10, 26, 0.9));
      border: 2px solid rgba(212, 168, 83, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.35s var(--transition-smooth), box-shadow 0.35s var(--transition-smooth);
      box-shadow:
        0 0 30px rgba(212, 168, 83, 0.15),
        inset 0 0 30px rgba(212, 168, 83, 0.05);
      -webkit-tap-highlight-color: transparent;
      outline: none;
      -webkit-touch-callout: none;
    }

    .send-btn:active {
      transform: scale(0.93);
      box-shadow:
        0 0 50px rgba(212, 168, 83, 0.3),
        inset 0 0 40px rgba(212, 168, 83, 0.1);
    }

    /* 呼吸放大动画（发送中） */
    .send-btn.sending {
      animation: breatheScale 0.8s var(--transition-smooth) infinite;
    }

    @keyframes breatheScale {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 0 30px rgba(212, 168, 83, 0.15), inset 0 0 30px rgba(212, 168, 83, 0.05);
      }
      50% {
        transform: scale(1.08);
        box-shadow: 0 0 55px rgba(212, 168, 83, 0.4), inset 0 0 45px rgba(212, 168, 83, 0.15);
      }
    }

    /* 爱心图标 — 使用 CSS 绘制跳动爱心 */
    .heart-icon {
      position: relative;
      width: 50px;
      height: 50px;
      animation: heartBeat 1.2s ease-in-out infinite;
      filter: drop-shadow(0 0 12px rgba(212, 40, 60, 0.6));
    }

    .heart-icon::before,
    .heart-icon::after {
      content: '';
      position: absolute;
      top: 0;
      width: 26px;
      height: 42px;
      border-radius: 26px 26px 0 0;
      background: linear-gradient(180deg, #e8505b, #c0392b);
    }
    .heart-icon::before {
      left: 26px;
      transform: rotate(-45deg);
      transform-origin: 0 100%;
    }
    .heart-icon::after {
      left: 0;
      transform: rotate(45deg);
      transform-origin: 100% 100%;
    }

    @keyframes heartBeat {
      0%, 100% { transform: scale(1); }
      15% { transform: scale(1.15); }
      30% { transform: scale(1); }
      45% { transform: scale(1.12); }
      60% { transform: scale(1); }
    }

    .send-btn-label {
      margin-top: 6px;
      font-size: 0.8rem;
      font-weight: 300;
      letter-spacing: 0.08em;
      color: var(--color-gold);
    }

    .send-status {
      margin-top: 10px;
      font-size: 0.75rem;
      color: var(--color-white-soft);
      min-height: 20px;
      text-align: center;
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    .send-status.visible { opacity: 1; }
    .send-status.success { color: #7ecb8a; }
    .send-status.error { color: #e8505b; }

    /* ============================================================
       动图选择卡片区域
       ============================================================ */
    .gif-selector {
      width: 100%;
      max-width: 420px;
      margin-bottom: 16px;
    }

    .section-label {
      font-size: 0.75rem;
      font-weight: 400;
      letter-spacing: 0.1em;
      color: var(--color-white-soft);
      margin-bottom: 10px;
      padding-left: 4px;
    }

    .card-scroll {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      padding: 4px 0 8px;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .card-scroll::-webkit-scrollbar { display: none; }

    /* 单张动图卡片 */
    .gif-card {
      flex: 0 0 100px;
      height: 120px;
      border-radius: var(--radius-sm);
      background: var(--color-card-bg);
      border: 2px solid var(--color-card-border);
      overflow: hidden;
      cursor: pointer;
      scroll-snap-align: start;
      transition: border-color 0.3s ease, transform 0.3s ease, box-shadow 0.3s ease;
      position: relative;
    }
    .gif-card:active {
      transform: scale(0.96);
    }
    .gif-card.active {
      border-color: var(--color-card-border-active);
      box-shadow: 0 0 16px rgba(212, 168, 83, 0.35);
    }
    .gif-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }
    .gif-card .card-hint {
      position: absolute;
      bottom: 0;
      left: 0; right: 0;
      padding: 4px 0;
      text-align: center;
      font-size: 0.6rem;
      color: var(--color-white);
      background: linear-gradient(transparent, rgba(0,0,0,0.7));
      pointer-events: none;
    }

    /* 预览蒙层 */
    .preview-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .preview-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }
    .preview-overlay img {
      max-width: 85vw;
      max-height: 70vh;
      border-radius: var(--radius-md);
      box-shadow: 0 0 60px rgba(212, 168, 83, 0.3);
    }
    .preview-close {
      position: absolute;
      top: max(30px, env(safe-area-inset-top, 16px));
      right: 20px;
      width: 36px; height: 36px;
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      color: var(--color-white);
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ============================================================
       自定义上传区域
       ============================================================ */
    .upload-area {
      width: 100%;
      max-width: 420px;
      margin-top: 8px;
    }

    .upload-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 14px;
      border-radius: var(--radius-sm);
      background: rgba(212, 168, 83, 0.08);
      border: 1px dashed rgba(212, 168, 83, 0.35);
      color: var(--color-gold-light);
      font-size: 0.85rem;
      font-weight: 400;
      cursor: pointer;
      transition: background 0.3s ease, border-color 0.3s ease;
      letter-spacing: 0.04em;
    }
    .upload-btn:active {
      background: rgba(212, 168, 83, 0.18);
      border-color: var(--color-gold);
    }
    .upload-btn svg {
      width: 18px; height: 18px;
      stroke: currentColor;
    }

    .upload-preview {
      margin-top: 10px;
      display: none;
      text-align: center;
    }
    .upload-preview.show { display: block; }
    .upload-preview img {
      max-width: 200px;
      max-height: 160px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--color-card-border);
    }
    .upload-preview .use-uploaded-btn {
      display: inline-block;
      margin-top: 8px;
      padding: 8px 20px;
      border-radius: 20px;
      background: var(--color-gold);
      color: var(--bg-deep);
      font-size: 0.8rem;
      font-weight: 600;
      border: none;
      cursor: pointer;
      letter-spacing: 0.04em;
      transition: transform 0.2s ease;
    }
    .upload-preview .use-uploaded-btn:active { transform: scale(0.95); }

    .upload-error {
      margin-top: 6px;
      font-size: 0.7rem;
      color: #e8505b;
      display: none;
    }
    .upload-error.show { display: block; }

    /* 隐藏的文件输入 */
    #file-input { display: none; }

    /* ============================================================
       Toast 提示
       ============================================================ */
    .toast {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) translateY(20px);
      z-index: 200;
      padding: 14px 28px;
      border-radius: 30px;
      background: rgba(20, 20, 45, 0.95);
      border: 1px solid var(--color-card-border);
      color: var(--color-white);
      font-size: 0.85rem;
      text-align: center;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.35s ease, transform 0.35s ease;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      max-width: 80vw;
    }
    .toast.show {
      opacity: 1;
      transform: translate(-50%, -50%) translateY(0);
    }

    /* ============================================================
       通知权限引导横幅
       ============================================================ */
    .permission-banner {
      width: 100%;
      max-width: 420px;
      margin-bottom: 14px;
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      background: rgba(212, 168, 83, 0.1);
      border: 1px solid rgba(212, 168, 83, 0.3);
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 0.78rem;
      color: var(--color-gold-light);
    }
    .permission-banner.show { display: flex; }
    .permission-banner .enable-btn {
      flex-shrink: 0;
      padding: 7px 16px;
      border-radius: 20px;
      background: var(--color-gold);
      color: var(--bg-deep);
      font-size: 0.75rem;
      font-weight: 600;
      border: none;
      cursor: pointer;
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>

  <!-- 星空画布 -->
  <canvas id="star-canvas"></canvas>

  <!-- ============================================================
       主内容
       ============================================================ -->
  <div class="app-container">

    <!-- 顶部标题 -->
    <header class="header">
      <h1 class="header-title">heartbeat-signal</h1>
    </header>

    <!-- 通知权限引导 -->
    <div class="permission-banner" id="permission-banner">
      <span>开启通知，及时收到TA的心动信号 💗</span>
      <button class="enable-btn" id="enable-notif-btn">开启</button>
    </div>

    <!-- 发送按钮 -->
    <div class="send-btn-area">
      <button class="send-btn" id="send-btn" aria-label="发送心动信号">
        <div class="heart-icon"></div>
        <span class="send-btn-label">发送心动</span>
      </button>
      <div class="send-status" id="send-status"></div>
    </div>

    <!-- 动图选择区 -->
    <div class="gif-selector">
      <p class="section-label">选择动图</p>
      <div class="card-scroll" id="gif-card-list">
        <!-- JS 动态生成 -->
      </div>
    </div>

    <!-- 自定义上传 -->
    <div class="upload-area">
      <button class="upload-btn" id="upload-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
        上传自定义动图
      </button>
      <input type="file" id="file-input" accept="image/gif,image/png,image/jpeg,image/webp">
      <div class="upload-error" id="upload-error"></div>
      <div class="upload-preview" id="upload-preview">
        <img id="upload-preview-img" src="" alt="上传预览">
        <button class="use-uploaded-btn" id="use-uploaded-btn">设为发送动图</button>
      </div>
    </div>

  </div>

  <!-- 大图预览蒙层 -->
  <div class="preview-overlay" id="preview-overlay">
    <button class="preview-close" id="preview-close">&times;</button>
    <img id="preview-img" src="" alt="预览">
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- ============================================================
       JavaScript — 应用主逻辑
       ============================================================ -->
  <script>
  (function() {
    'use strict';

    // ======================== 配置 ========================
    /**
     * 后端 API 地址
     * - 本地开发（localhost）使用空字符串，即相对路径请求
     * - 支持 ?api= 参数手动指定
     * - 否则使用同源 location.origin
     */
    const API_BASE = (() => {
      const params = new URLSearchParams(window.location.search);
      if (params.has('api')) return params.get('api');
      if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') return '';
      return window.location.origin;
    })();
    const API = {
      subscribe: API_BASE + '/subscribe',
      sendSignal: API_BASE + '/send-signal',
      uploadImage: API_BASE + '/upload-image',
    };

    // 内置动图列表 — 使用在线占位 GIF/图片 URL（后续可替换为真实动图）
    const BUILTIN_GIFS = [
      {
        id: 'heartbeat',
        label: '基础心动',
        url: 'data:image/svg+xml,' + encodeURIComponent(
          '<svg xmlns="http://www.w3.org/2000/svg" width="300" height="360" viewBox="0 0 300 360">' +
          '<rect width="300" height="360" fill="#0a0a1a"/>' +

          '<circle cx="50" cy="40" r="1.5" fill="#fff" opacity="0.8"><animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/></circle>' +

          '<circle cx="230" cy="55" r="1.8" fill="#f0d68a" opacity="0.7"><animate attributeName="opacity" values="0.7;0.2;0.7" dur="3s" repeatCount="indefinite"/></circle>' +
          '<circle cx="80" cy="90" r="1.2" fill="#fff" opacity="0.5"><animate attributeName="opacity" values="0.5;0.1;0.5" dur="1.8s" repeatCount="indefinite"/></circle>' +
          '<circle cx="200" cy="70" r="1" fill="#f0d68a" opacity="0.6"><animate attributeName="opacity" values="0.6;0.15;0.6" dur="2.2s" repeatCount="indefinite"/></circle>' +
          '<!-- 金色心跳线爱心 -->' +
          '<path d="M150 220 L150 140 Q150 110 130 110 Q100 110 100 145 Q100 175 150 230 Q200 175 200 145 Q200 110 170 110 Q150 110 150 140Z" fill="none" stroke="#d4a853" stroke-width="3" stroke-dasharray="300" stroke-dashoffset="300" opacity="0.9">' +
            '<animate attributeName="stroke-dashoffset" from="300" to="0" dur="2s" fill="freeze" repeatCount="indefinite"/>' +
          '</path>' +
          '<circle cx="150" cy="165" r="3" fill="#e8505b" opacity="0.9"><animate attributeName="r" values="2;5;2" dur="1.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.9;0.3;0.9" dur="1.2s" repeatCount="indefinite"/></circle>' +
          '</svg>'
        ),
      },
      {
        id: 'birthday',
        label: '生日快乐',
        url: 'data:image/svg+xml,' + encodeURIComponent(
          '<svg xmlns="http://www.w3.org/2000/svg" width="300" height="360" viewBox="0 0 300 360">' +
          '<rect width="300" height="360" fill="#0a0a1a"/>' +
          '<!-- 星星闪烁 -->' +
          '<circle cx="40" cy="35" r="1.5" fill="#f0d68a"><animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/></circle>' +
          '<circle cx="120" cy="20" r="1" fill="#fff"><animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/></circle>' +
          '<circle cx="250" cy="40" r="2" fill="#d4a853"><animate attributeName="opacity" values="0.6;0.1;0.6" dur="2.8s" repeatCount="indefinite"/></circle>' +
          '<circle cx="180" cy="60" r="1.2" fill="#fff"><animate attributeName="opacity" values="0.5;0.1;0.5" dur="1.7s" repeatCount="indefinite"/></circle>' +
          '<circle cx="90" cy="75" r="1" fill="#f0d68a"><animate attributeName="opacity" values="0.4;0.9;0.4" dur="2.1s" repeatCount="indefinite"/></circle>' +
          '<!-- Happy birthday 文字 -->' +
          '<text x="150" y="115" text-anchor="middle" fill="#d4a853" font-family="serif" font-size="20" font-weight="bold" letter-spacing="3">Happy birthday</text>' +
          '<!-- 简笔画蛋糕（逐渐画出） -->' +
          '<g stroke="#f0d68a" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">' +
            '<!-- 底层 -->' +
            '<rect x="90" y="200" width="120" height="28" rx="6" stroke-dasharray="300" stroke-dashoffset="300">' +
              '<animate attributeName="stroke-dashoffset" from="300" to="0" dur="2.5s" fill="freeze" repeatCount="indefinite"/>' +
            '</rect>' +
            '<!-- 中层 -->' +
            '<rect x="105" y="175" width="90" height="28" rx="5" stroke-dasharray="300" stroke-dashoffset="300">' +
              '<animate attributeName="stroke-dashoffset" from="300" to="0" dur="2.5s" begin="0.6s" fill="freeze" repeatCount="indefinite"/>' +
            '</rect>' +
            '<!-- 顶层 -->' +
            '<rect x="120" y="150" width="60" height="28" rx="4" stroke-dasharray="300" stroke-dashoffset="300">' +
              '<animate attributeName="stroke-dashoffset" from="300" to="0" dur="2.5s" begin="1.2s" fill="freeze" repeatCount="indefinite"/>' +
            '</rect>' +
            '<!-- 蜡烛 -->' +
            '<line x1="150" y1="150" x2="150" y2="125" stroke-dasharray="300" stroke-dashoffset="300">' +
              '<animate attributeName="stroke-dashoffset" from="300" to="0" dur="2.5s" begin="1.8s" fill="freeze" repeatCount="indefinite"/>' +
            '</line>' +
            '<!-- 火焰 -->' +
            '<ellipse cx="150" cy="120" rx="5" ry="9" fill="#e8505b" stroke="none" opacity="0">' +
              '<animate attributeName="opacity" from="0" to="0.9" dur="0.5s" begin="2.5s" fill="freeze" repeatCount="indefinite"/>' +
              '<animate attributeName="ry" values="9;7;9" dur="0.3s" repeatCount="indefinite"/>' +
            '</ellipse>' +
          '</g>' +
          '</svg>'
        ),
      },
      {
        id: 'firework',
        label: '烟花庆祝',
        url: 'data:image/svg+xml,' + encodeURIComponent(
          '<svg xmlns="http://www.w3.org/2000/svg" width="300" height="360" viewBox="0 0 300 360">' +
          '<rect width="300" height="360" fill="#0a0a1a"/>' +
          '<!-- 星空背景 -->' +

    // ======================== 星空画布 ========================
    let _starAnimId = null; // 模块级引用，供 visibilitychange 事件使用

    function initStarCanvas() {
      const canvas = $('#star-canvas');
      const ctx = canvas.getContext('2d');
      let stars = [];

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        initStars();
      }

      function initStars() {
        const count = Math.floor((canvas.width * canvas.height) / 1800);
        stars = [];
        for (let i = 0; i < count; i++) {
          stars.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            r: Math.random() * 2.2 + 0.4,
            alpha: Math.random(),
            deltaAlpha: (Math.random() - 0.5) * 0.02,
            hue: Math.random() < 0.15 ? 42 : 0, // 约15% 是金色星星
          });
        }
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (const s of stars) {
          s.alpha += s.deltaAlpha;
          if (s.alpha > 1) { s.alpha = 1; s.deltaAlpha *= -1; }
          if (s.alpha < 0.15) { s.alpha = 0.15; s.deltaAlpha *= -1; }

          const color = s.hue === 42
            ? `hsla(${s.hue}, 60%, 70%, ${s.alpha})`
            : `rgba(255,255,255,${s.alpha})`;

          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          ctx.fillStyle = color;
          ctx.fill();

          // 较亮的星星加辉光
          if (s.r > 1.5 && s.alpha > 0.7) {
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.r * 2.5, 0, Math.PI * 2);
            ctx.fillStyle = s.hue === 42
              ? `rgba(212,168,83,${s.alpha * 0.15})`
              : `rgba(255,255,255,${s.alpha * 0.1})`;
            ctx.fill();
          }
        }
        _starAnimId = requestAnimationFrame(draw);
      }

      // 页面可见性变化时暂停/恢复动画，节省后台资源
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          if (_starAnimId) { cancelAnimationFrame(_starAnimId); _starAnimId = null; }
        } else {
          if (!_starAnimId) draw();
        }
      });

      resize();
      draw();
      window.addEventListener('resize', resize);
    }

        card.className = 'gif-card' + (idx === selectedGifIdx && !uploadedGifUrl ? ' active' : '');
        card.setAttribute('data-idx', idx);
        card.innerHTML = `

        `;
        // 点击选中
        card.addEventListener('click', () => selectGif(idx));
        // 长按预览（移动超过 10px 则判定为滚动，取消长按）
        let pressTimer;
        let touchStartX = 0;
        let touchStartY = 0;

        card.addEventListener('touchstart', (e) => {
          const t = e.touches[0];
          touchStartX = t.clientX;
          touchStartY = t.clientY;
          pressTimer = setTimeout(() => previewGif(gif.url), 400);
        }, { passive: true });

        card.addEventListener('touchend', () => clearTimeout(pressTimer));

        card.addEventListener('touchmove', (e) => {
          const t = e.touches[0];
          const dx = t.clientX - touchStartX;
          const dy = t.clientY - touchStartY;
          if (Math.abs(dx) > 10 || Math.abs(dy) > 10) {
            clearTimeout(pressTimer);
          }
        }, { passive: true });
        gifCardList.appendChild(card);
      });
    }

    /**
     * 检查通知权限状态
     * iOS 16.4+ 支持 Notification API（包括 Notification.permission）
     */
    function checkNotificationPermission() {
      if (!('Notification' in window)) return 'unsupported';
      return Notification.permission; // 'default' | 'granted' | 'denied'
    }

    /**
     * 请求通知权限
     * iOS 16.4+：首次调用 Notification.requestPermission() 会弹出系统授权对话框
     */
    async function requestNotificationPermission() {
      if (!('Notification' in window)) {
        showToast('您的设备不支持通知功能', 2500);
        return 'denied';
      }
      try {
        const perm = await Notification.requestPermission();
        console.log('[App] 通知权限:', perm);
        if (perm === 'granted') {
          permissionBanner.classList.remove('show');
        }
        return perm;
      } catch (err) {
        console.error('[App] 请求通知权限失败:', err);
        return 'denied';
      }
    }

    /**
     * 获取 VAPID 公钥（从后端获取）
     * 部署后需要在后端 /vapid-public-key 接口返回公钥
     */
    async function getVapidPublicKey() {
      try {
        const resp = await fetch(API_BASE + '/vapid-public-key');
        if (!resp.ok) throw new Error('获取 VAPID 公钥失败');
        const data = await resp.json();
        return data.publicKey;
      } catch (err) {
        console.error('[App] 获取 VAPID 公钥失败:', err);
        // 降级：返回一个占位公钥（部署后需替换）
        return null;
      }
    }

    /**
     * 订阅推送
     * 使用 applicationServerKey（VAPID 公钥）创建订阅
     */
    async function subscribeToPush(registration) {
      if (!registration) return null;
      try {
        const publicKey = await getVapidPublicKey();
        if (!publicKey) {
          console.warn('[App] 无 VAPID 公钥，跳过推送订阅');
          return null;
        }

        // 检查已有订阅
        let subscription = await registration.pushManager.getSubscription();
        if (subscription) {
          console.log('[App] 已有推送订阅');
          pushSubscription = subscription;
          return subscription;
        }

        // 创建新订阅
        subscription = await registration.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlBase64ToUint8Array(publicKey),
        });
        console.log('[App] 推送订阅成功:', subscription);
        pushSubscription = subscription;
        return subscription;
      } catch (err) {
        console.error('[App] 推送订阅失败:', err);
        return null;
      }
    }

    /**
     * 将 Base64 URL-safe 字符串转换为 Uint8Array
     * VAPID 公钥需要此格式传给 pushManager.subscribe
     */
    function urlBase64ToUint8Array(base64String) {
      const padding = '='.repeat((4 - (base64String.length % 4)) % 4);
      const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
      const rawData = atob(base64);
      const outputArray = new Uint8Array(rawData.length);
      for (let i = 0; i < rawData.length; ++i) {
        outputArray[i] = rawData.charCodeAt(i);
      }
      return outputArray;
    }

    /**
     * 将订阅信息发送到后端存储
     */
    async function sendSubscriptionToServer(subscription) {
      if (!subscription) return false;
      try {
        const resp = await fetch(API.subscribe, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(subscription.toJSON()),
        });
        if (resp.ok) {
          console.log('[App] 订阅信息已发送到服务器');
          return true;
        }
        console.warn('[App] 发送订阅信息失败:', resp.status);
        return false;
      } catch (err) {
        console.error('[App] 发送订阅信息异常:', err);
        return false;
      }
    }

    // ======================== 初始化通知 ========================
    async function initNotifications(registration) {
      // 检查权限状态
      const perm = checkNotificationPermission();

      if (perm === 'granted') {
        // 已授权，直接订阅
        permissionBanner.classList.remove('show');
        const subscription = await subscribeToPush(registration);
        if (subscription) {
          await sendSubscriptionToServer(subscription);
        }
      } else if (perm === 'default') {
        // 未决定，显示引导横幅
        permissionBanner.classList.add('show');
      } else if (perm === 'denied') {
        // 已被拒绝
        console.warn('[App] 通知权限已被拒绝');
        permissionBanner.classList.remove('show');
      } else {
        // 不支持
        console.warn('[App] 不支持 Notification API');
        permissionBanner.classList.remove('show');
      }
    }

      if (isSending) return;
      isSending = true;
      sendBtn.classList.add('sending');
      setStatus('正在发送...', '');

      const gifUrl = getSelectedGifUrl();
      const payload = {
        image: gifUrl,
        title: '来自TA的心动信号 💗',
        body: 'TA给你发送了一个心动信号~',
        timestamp: Date.now(),
      };

      try {
        const resp = await fetch(API.sendSignal, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });

        if (resp.ok) {
          setStatus('发送成功 ✨', 'success');
          if (navigator.vibrate) navigator.vibrate([50, 80, 50]);
        } else {
          const errData = await resp.json().catch(() => ({}));
          setStatus(errData.error || '发送失败，请重试', 'error');
        }
      } catch (err) {
        console.error('[App] 发送失败:', err);
        // 离线降级：本地模拟成功
        setStatus('已发送（离线模式）✨', 'success');
      }

      // 发送动画持续
      setTimeout(() => {
        sendBtn.classList.remove('sending');
        isSending = false;
      }, 1200);
    });

    // ======================== 应用启动 ========================
    async function init() {
      // 1. 初始化星空背景
      initStarCanvas();

      // 2. 渲染动图卡片
      renderGifCards();

      // 3. 注册 Service Worker
      swRegistration = await registerSW();

      // 4. 初始化通知（检查权限、订阅推送）
      if (swRegistration) {
        // 等待 SW 激活
        if (swRegistration.installing) {
          swRegistration.installing.addEventListener('statechange', (e) => {
            if (e.target.state === 'activated') {
              initNotifications(swRegistration);
            }
          });
        } else {
          initNotifications(swRegistration);
        }
      }

      console.log('[App] 初始化完成 🚀');
    }

    // 启动
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  })();
  </script>
</body>
</html>
